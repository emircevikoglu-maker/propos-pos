name: keepalive
on:
  schedule:
    - cron: "17 4 * * *"   # günde 1 (UTC)
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase keepalive (içeriksiz)
        env:
          URL: ${{ secrets.PROPOS_KEEPALIVE_URL }}
        run: |
          test -n "$URL" || { echo "PROPOS_KEEPALIVE_URL secret tanımlı değil"; exit 1; }
          curl --fail --silent --show-error --max-time 20 --retry 2 --output /dev/null "$URL"
          echo ok
